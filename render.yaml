services:
  - type: web
    name: school-management-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    branch: feature/devops-docker-k8s
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://school-management487.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
